<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS CDN for Excel (.xlsx) Export & Import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Custom App CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- App Top Navigation Header -->
    <header class="bg-slate-900 text-white px-4 py-2 flex items-center justify-between shadow-md flex-wrap gap-2.5 z-30 border-b border-slate-800">
        <!-- Brand & Editable Project Title -->
        <div class="flex items-center gap-2.5">
            <div class="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-indigo-700 px-3 py-1 rounded-lg text-white font-bold text-xs tracking-wide shadow-sm">
                <svg class="w-4 h-4 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
                <span>PMTool</span>
            </div>
            <input type="text" id="project-title-input" value="Project Management Schedule" class="bg-slate-800/90 hover:bg-slate-800 focus:bg-slate-800 border border-slate-700/80 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 text-slate-100 text-xs font-semibold px-2.5 py-1 rounded-md focus:outline-none w-52 md:w-64 transition shadow-xs" title="Click to rename project">
        </div>

        <!-- Center View Switcher & Baseline KPI Summary -->
        <div class="flex items-center gap-2.5">
            <!-- View Switcher Segmented Control -->
            <div class="bg-slate-800/90 p-0.5 rounded-lg flex items-center gap-0.5 border border-slate-700/80 text-xs shadow-inner">
                <button id="view-btn-split" class="px-3 py-1 bg-indigo-600 text-white rounded-md font-medium text-xs shadow-sm transition">Grid & Gantt</button>
                <button id="view-btn-resources" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700/60 rounded-md font-medium text-xs transition">Engineer Workload</button>
                <button id="view-btn-deptree" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700/60 rounded-md font-medium text-xs transition">Dependency Tree</button>
                <button id="view-btn-milestones" class="px-3 py-1 text-slate-300 hover:text-white hover:bg-slate-700/60 rounded-md font-medium text-xs transition">Milestones</button>
                <button id="view-btn-info" class="px-3 py-1 text-amber-300 hover:text-amber-200 hover:bg-slate-700/60 rounded-md font-medium text-xs flex items-center gap-1 transition">
                    <span>❓ Guide</span>
                </button>
            </div>

            <!-- Baseline KPI Status Badge -->
            <div id="header-baseline-kpi" class="hidden 2xl:block px-2.5 py-1 bg-slate-800/90 text-slate-400 rounded-md text-xs border border-slate-700/80 font-mono">
                Baseline: Not Set
            </div>
        </div>

        <!-- Right Action Toolbars: Config, Storage, Output -->
        <div class="flex items-center gap-2">
            <!-- Cluster 1: Configuration & Baselines -->
            <div class="flex items-center gap-1 bg-slate-800/70 p-0.5 rounded-lg border border-slate-700/70">
                <button id="btn-calendar-config" class="px-2.5 py-1 text-indigo-300 hover:text-white hover:bg-indigo-900/60 rounded-md font-medium text-xs flex items-center gap-1.5 transition" title="Configure Working Days, Festive Holidays & Overtime Days">
                    <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span>Calendar</span>
                </button>

                <button id="btn-streams" class="px-2.5 py-1 text-pink-300 hover:text-white hover:bg-pink-900/40 rounded-md font-medium text-xs flex items-center gap-1.5 transition" title="Customize Workstream Colors and Names">
                    <svg class="w-3.5 h-3.5 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4 4 4 0 014-4h4a4 4 0 014 4v4H7zm0-10a4 4 0 01-4-4 4 4 0 014-4h4a4 4 0 014 4v4H7zm10 10a4 4 0 01-4-4 4 4 0 014-4h4a4 4 0 014 4v4h-4zm0-10a4 4 0 01-4-4 4 4 0 014-4h4a4 4 0 014 4v4h-4z"/></svg>
                    <span>Streams</span>
                </button>

                <select id="baseline-select" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 focus:outline-none max-w-[130px]" title="Baseline used for variance comparison"></select>

                <button id="btn-set-baseline" class="px-2 py-1 text-amber-300 hover:text-amber-200 hover:bg-slate-700/60 rounded-md font-medium text-xs flex items-center gap-1 transition" title="Capture a new baseline (previous baselines are kept)">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <span>Baseline</span>
                </button>
            </div>

            <!-- Cluster 2: File Storage (.prj) -->
            <div class="flex items-center gap-1 bg-slate-800/70 p-0.5 rounded-lg border border-slate-700/70">
                <button id="btn-save-prj" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-semibold text-xs flex items-center gap-1 shadow-sm transition" title="Save in place (Ctrl+S)">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                    <span>Save</span>
                </button>

                <button id="btn-save-as-prj" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-slate-700/60 rounded-md font-medium text-xs transition" title="Save copy to a new file...">
                    <span>Save As...</span>
                </button>

                <button id="btn-import-prj" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-slate-700/60 rounded-md font-medium text-xs flex items-center gap-1 transition" title="Open project file (.prj)">
                    <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <span>Open</span>
                </button>
                <input type="file" id="prj-file-input" accept=".prj,.json" class="hidden">
            </div>

            <!-- Cluster 3: Output & Presets -->
            <div class="flex items-center gap-1">
                <button id="btn-export-excel" class="px-2 py-1 bg-emerald-700/90 hover:bg-emerald-700 text-white rounded-md font-medium text-xs flex items-center gap-1 shadow-xs transition" title="Export to Excel (.xlsx) for backward compatibility">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span>Excel</span>
                </button>

                <select id="preset-select" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-md px-2 py-1 focus:outline-none" title="Create a new blank project or load a sample preset">
                    <option value="">Presets...</option>
                    <option value="new_blank">➕ Blank Project</option>
                    <option value="iot_device">📁 IoT Tracker Schedule</option>
                </select>

                <select id="print-select" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-md px-2 py-1 focus:outline-none" title="Print or Save PDF of individual views">
                    <option value="">Print / PDF...</option>
                    <option value="all">Full Screen</option>
                    <option value="gantt">Gantt Only</option>
                    <option value="wbs">Activity List Only</option>
                    <option value="milestones">Milestones Only</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- Split View (Grid + Gantt) -->
        <div id="split-view-container" class="w-full h-full flex overflow-hidden">
            <!-- Left Pane: WBS Grid -->
            <div id="wbs-pane" style="width: 50%; min-width: 340px;" class="h-full flex-shrink-0"></div>

            <!-- Draggable Split Resizer Bar -->
            <div id="split-resizer" class="split-resizer h-full z-20"></div>

            <!-- Right Pane: Interactive Gantt Chart -->
            <div id="gantt-pane" class="flex-1 h-full overflow-hidden"></div>
        </div>

        <!-- Resource Pool & Workload Heatmap View (Initially Hidden) -->
        <div id="resource-view-container" class="w-full h-full hidden overflow-auto"></div>

        <!-- Network Diagram / Dependency Tree View (Initially Hidden) -->
        <div id="deptree-view-container" class="w-full h-full hidden overflow-auto"></div>

        <!-- Milestone Executive Roadmap View (Initially Hidden) -->
        <div id="milestones-view-container" class="w-full h-full hidden overflow-auto"></div>

        <!-- Info & User Guide View (Initially Hidden) -->
        <div id="info-guide-view-container" class="w-full h-full hidden overflow-auto"></div>

        <!-- Calendar Config Modal Container -->
        <div id="calendar-modal-container"></div>

        <!-- Workstream Color Palette Modal Container -->
        <div id="stream-modal-container"></div>

    </main>

    <!-- App Entry Point Module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
